name: Apple 27 validation

on:
  workflow_call:
  # Never add workflow_dispatch or pull_request here. Trusted manual runs enter
  # through build-archive.yml on dev, which calls this definition at @dev.
  # This protected runner executes Blender and project code and must only
  # consume trusted dev/release revisions.
  push:
    branches: [dev]
    paths:
      - ".github/workflows/apple-platform-validation.yml"
      - "Plugin/**"
      - "References/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: apple-27-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize-apple-revision:
    name: Authorize protected-runner revision
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.policy.outputs.authorized }}
      authorized_sha: ${{ steps.policy.outputs.authorized_sha }}
      revision_kind: ${{ steps.policy.outputs.revision_kind }}
    env:
      EXPECTED_REPOSITORY: tomkrikorian/BlenderToRCP
      REQUESTED_EVENT: ${{ github.event_name }}
      REQUESTED_REF: ${{ github.ref }}
      REQUESTED_REF_TYPE: ${{ github.ref_type }}
      REQUESTED_REPOSITORY: ${{ github.repository }}
      REQUESTED_SHA: ${{ github.sha }}
    steps:
      # This job intentionally runs on an ephemeral GitHub-hosted runner. A
      # reusable workflow inherits github.ref/github.sha from its caller, so no
      # caller-selected revision may reach the persistent Apple runner until it
      # has passed this independent policy check.
      - name: Checkout requested revision for read-only policy validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Authorize dev or an exact release tag
        id: policy
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$REQUESTED_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Refusing Apple runner access for foreign caller: $REQUESTED_REPOSITORY" >&2
            exit 1
          fi

          # In a reusable workflow this remains the caller's original event;
          # GitHub does not replace it with "workflow_call".
          case "$REQUESTED_EVENT" in
            push|workflow_dispatch) ;;
            *)
              echo "Refusing unsupported Apple validation event: $REQUESTED_EVENT" >&2
              exit 1
              ;;
          esac

          release_tag=""
          if [[ "$REQUESTED_REF" == "refs/heads/dev" ]]; then
            if [[ "$REQUESTED_REF_TYPE" != "branch" ]]; then
              echo "dev must be presented as a branch ref" >&2
              exit 1
            fi
            revision_kind="dev"
          elif [[ "$REQUESTED_REF" =~ ^refs/tags/((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            if [[ "$REQUESTED_REF_TYPE" != "tag" ]]; then
              echo "Release revision must be presented as a tag ref" >&2
              exit 1
            fi
            release_tag="${BASH_REMATCH[1]}"
            manifest_version="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("Plugin/blender_manifest.toml").read_text())["version"])
          PY
          )"
            if [[ "$release_tag" != "$manifest_version" ]]; then
              echo "Release tag $release_tag does not match manifest version $manifest_version" >&2
              exit 1
            fi
            revision_kind="release-tag"
          else
            echo "Refusing untrusted Apple validation ref: $REQUESTED_REF" >&2
            exit 1
          fi

          requested_commit="$(git rev-parse "${REQUESTED_SHA}^{commit}")"
          checked_out_commit="$(git rev-parse 'HEAD^{commit}')"
          if [[ "$requested_commit" != "$checked_out_commit" ]]; then
            echo "Checked-out commit does not match requested SHA" >&2
            exit 1
          fi

          git fetch --no-tags --force origin \
            '+refs/heads/dev:refs/remotes/origin/dev'
          if ! git merge-base --is-ancestor \
            "$requested_commit" refs/remotes/origin/dev
          then
            echo "Requested commit is not reachable from origin/dev" >&2
            exit 1
          fi

          if [[ -n "$release_tag" ]]; then
            git fetch --force origin \
              "+refs/tags/${release_tag}:refs/tags/${release_tag}"
            tag_commit="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
            if [[ "$tag_commit" != "$requested_commit" ]]; then
              echo "Release ref does not resolve to the requested commit" >&2
              exit 1
            fi
          fi

          {
            echo "authorized=true"
            echo "authorized_sha=$requested_commit"
            echo "revision_kind=$revision_kind"
          } >> "$GITHUB_OUTPUT"

  apple-27:
    name: macOS 27, Xcode 27 and Reality Composer Pro 3
    needs: authorize-apple-revision
    if: needs.authorize-apple-revision.outputs.authorized == 'true'
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - macos-27
      - xcode-27
      - reality-composer-pro-3
      - blender-5.2
    timeout-minutes: 120
    env:
      PYTHON_VERSION: "3.13"
      PYTEST_VERSION: "9.1.1"
      APPLE_MIN_VERSION: "27.0"
      BLENDER_TARGET_VERSION: "5.2"
      BLENDER_VERSION_MODE: exact
      RCP_REQUIRED_MAJOR: "3"
      DEVELOPER_DIR: ${{ vars.XCODE_27_DEVELOPER_DIR || '/Applications/Xcode-beta.app/Contents/Developer' }}
      BLENDERTORCP_BLENDER: ${{ vars.BLENDER_52_EXECUTABLE || '/Applications/Blender.app/Contents/MacOS/Blender' }}
      RCP_APP: ${{ vars.RCP3_APP_PATH || '/Applications/RealityComposerPro.app' }}
      APPLE_VALIDATION_DIR: /tmp/blendertorcp-apple27-${{ github.run_id }}-${{ github.run_attempt }}
      BLENDER_USER_RESOURCES: /tmp/blendertorcp-apple-blender-user-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout with Reality Composer Pro assets
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          lfs: true
          persist-credentials: false
          ref: ${{ needs.authorize-apple-revision.outputs.authorized_sha }}

      - name: Create validation workspace
        run: mkdir -p "$APPLE_VALIDATION_DIR" "$BLENDER_USER_RESOURCES"

      - name: Verify protected Apple 27 runner
        run: bash scripts/check_apple27_toolchain.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        # Do not install PyPI usd-core here. validate_exports must resolve the
        # Apple 27 usdchecker/usdcat selected by xcrun, not shadowing binaries.
        run: python -m pip install pytest==${PYTEST_VERSION}

      - name: Run Blender 5.2 integration tests on Apple Silicon
        run: >-
          python -m pytest -q tests/integration
          --junitxml="$APPLE_VALIDATION_DIR/apple-blender-integration.xml"

      - name: Export portable fixtures and assert the Specular Tint rejection
        run: |
          mkdir -p \
            "$APPLE_VALIDATION_DIR/exports/RedCube" \
            "$APPLE_VALIDATION_DIR/exports/CubeWith4Animations" \
            "$APPLE_VALIDATION_DIR/exports/SkinnedLimb" \
            "$APPLE_VALIDATION_DIR/exports/SpecularTint"

          python Plugin \
            --blender "$BLENDERTORCP_BLENDER" \
            --timeout 900 \
            export References/Blender/RedCube.blend \
            -o "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdc" \
            --format USDC \
            --diagnostics > "$APPLE_VALIDATION_DIR/exports/RedCube/export-usdc.json"

          python Plugin \
            --blender "$BLENDERTORCP_BLENDER" \
            --timeout 900 \
            export References/Blender/RedCube.blend \
            -o "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdz" \
            --format USDZ \
            --diagnostics > "$APPLE_VALIDATION_DIR/exports/RedCube/export-usdz.json"

          python Plugin \
            --blender "$BLENDERTORCP_BLENDER" \
            --timeout 900 \
            export References/Blender/CubeWith4Animations.blend \
            export-animation=true \
            author-animation-library=true \
            -o "$APPLE_VALIDATION_DIR/exports/CubeWith4Animations/CubeWith4Animations.usdc" \
            --format USDC \
            --diagnostics > "$APPLE_VALIDATION_DIR/exports/CubeWith4Animations/export-usdc.json"

          python Plugin \
            --blender "$BLENDERTORCP_BLENDER" \
            --timeout 900 \
            export References/Blender/t12_skinned_limb.blend \
            export-animation=true \
            author-animation-library=true \
            -o "$APPLE_VALIDATION_DIR/exports/SkinnedLimb/SkinnedLimb.usdc" \
            --format USDC \
            --diagnostics > "$APPLE_VALIDATION_DIR/exports/SkinnedLimb/export-usdc.json"

          set +e
          python Plugin \
            --blender "$BLENDERTORCP_BLENDER" \
            --json \
            --timeout 900 \
            export References/Blender/t21_specular_tint_refusal.blend \
            -o "$APPLE_VALIDATION_DIR/exports/SpecularTint/SpecularTint.usdc" \
            --format USDC \
            --diagnostics > "$APPLE_VALIDATION_DIR/exports/SpecularTint/expected-portable-rejection.json"
          tint_status=$?
          set -e
          if [[ "$tint_status" -eq 0 ]]; then
            echo "Specular Tint portable export unexpectedly succeeded" >&2
            exit 1
          fi

          TINT_REPORT="$APPLE_VALIDATION_DIR/exports/SpecularTint/expected-portable-rejection.json" \
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["TINT_REPORT"]).read_text())
          assert report.get("ok") is False, report
          error = report.get("error") or {}
          assert error.get("code") == "UNSUPPORTED_MATERIAL_NODES", error
          assert error.get("stage") == "validation", error
          details = error.get("details") or []
          assert any(
              detail.get("node_type") == "BSDF_PRINCIPLED"
              and "Specular Tint" in detail.get("message", "")
              and "RealityKit Portable" in detail.get("message", "")
              for detail in details
          ), details
          PY

          test -s "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdc"
          test -s "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdz"
          test -s "$APPLE_VALIDATION_DIR/exports/CubeWith4Animations/CubeWith4Animations.usdc"
          test -s "$APPLE_VALIDATION_DIR/exports/SkinnedLimb/SkinnedLimb.usdc"
          test ! -e "$APPLE_VALIDATION_DIR/exports/SpecularTint/SpecularTint.usdc"
          test -s "$APPLE_VALIDATION_DIR/exports/SpecularTint/SpecularTint.diagnostics.json"

      - name: Validate fresh USD and USDZ strictly
        run: |
          for asset in \
            "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdc" \
            "$APPLE_VALIDATION_DIR/exports/CubeWith4Animations/CubeWith4Animations.usdc" \
            "$APPLE_VALIDATION_DIR/exports/SkinnedLimb/SkinnedLimb.usdc"
          do
            xcrun usdchecker --strict "$asset"
            xcrun usdchecker --arkit --strict "$asset"
          done
          xcrun usdchecker --strict "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdz"
          xcrun usdchecker --arkit --strict "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdz"

      - name: Enforce the portable shipping material profile
        run: |
          profile_dump="$APPLE_VALIDATION_DIR/RedCube-material-profile.usda"
          xcrun usdcat \
            "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdc" \
            --out "$profile_dump"

          grep -Fq 'realitykit_portable' "$profile_dump"
          grep -Fq 'ND_realitykit_pbr_surfaceshader"' "$profile_dump"
          if grep -Eq \
            'ND_realitykit_pbr_surfaceshader_2_0|ND_open_pbr_surface_surfaceshader' \
            "$profile_dump"
          then
            echo "Experimental PBR2/OpenPBR surface escaped into the shipping profile" >&2
            exit 1
          fi

      - name: Compile fresh export for every Apple 27 platform
        run: |
          for platform in \
            xros \
            xrsimulator \
            macosx \
            iphoneos \
            iphonesimulator \
            appletvos \
            appletvsimulator
          do
            for asset_name in RedCube CubeWith4Animations SkinnedLimb
            do
              compiled_dir="$APPLE_VALIDATION_DIR/compiled/$platform/$asset_name"
              python3 scripts/validate_exports.py \
                --input "$APPLE_VALIDATION_DIR/exports/$asset_name/$asset_name.usdc" \
                --platform "$platform" \
                --deployment-target 27.0 \
                --use-metal \
                --compiled-output-dir "$compiled_dir" \
                --output "$APPLE_VALIDATION_DIR/export-$asset_name-$platform.json"
              test -s "$compiled_dir/$asset_name-$platform-27.0.reality"
            done
          done

      - name: Load fresh and compiled assets with RealityKit 27
        run: |
          set -o pipefail
          scripts/run_realitykit_runtime_smoke.sh \
            --asset "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdc" \
              --expect-model \
              --expect-shader-graph \
            --asset "$APPLE_VALIDATION_DIR/exports/RedCube/RedCube.usdz" \
              --expect-model \
              --expect-shader-graph \
            --asset "$APPLE_VALIDATION_DIR/compiled/macosx/RedCube/RedCube-macosx-27.0.reality" \
              --expect-model \
              --expect-shader-graph \
            --asset "$APPLE_VALIDATION_DIR/exports/CubeWith4Animations/CubeWith4Animations.usdc" \
              --expect-model \
              --expect-shader-graph \
              --expect-animation \
              --expect-animation-key GoBackward \
              --expect-animation-key GoDown \
              --expect-animation-key GoForward \
              --expect-animation-key GoUp \
            --asset "$APPLE_VALIDATION_DIR/compiled/macosx/CubeWith4Animations/CubeWith4Animations-macosx-27.0.reality" \
              --expect-model \
              --expect-shader-graph \
              --expect-animation \
              --expect-animation-key GoBackward \
              --expect-animation-key GoDown \
              --expect-animation-key GoForward \
              --expect-animation-key GoUp \
            --asset "$APPLE_VALIDATION_DIR/exports/SkinnedLimb/SkinnedLimb.usdc" \
              --expect-model \
              --expect-shader-graph \
              --expect-animation \
              --expect-animation-key Bend \
              --expect-animation-name Bend \
              --expect-component MeshDeformerComponent \
              --expect-component SkeletalPosesComponent \
            --asset "$APPLE_VALIDATION_DIR/compiled/macosx/SkinnedLimb/SkinnedLimb-macosx-27.0.reality" \
              --expect-model \
              --expect-shader-graph \
              --expect-animation \
              --expect-animation-key Bend \
              --expect-animation-name Bend \
              --expect-component MeshDeformerComponent \
              --expect-component SkeletalPosesComponent \
            --output "$APPLE_VALIDATION_DIR/realitykit-runtime.json" \
            | tee "$APPLE_VALIDATION_DIR/realitykit-runtime.log"

      - name: Bake, validate, compile and load baked exports
        # The bake lane is the default UI route for three of four material
        # modes, yet no baked output had ever been through usdchecker,
        # realitytool, or a RealityKit load in CI - only direct exports were
        # validated. Two RedCube bakes cover LIT_ALBEDO and UNLIT_ALBEDO;
        # LIT_IBL is exercised by the evaluation scenes, not here. Compiling
        # xros + macosx here is deliberate: the direct lane already proves all
        # seven platforms compile, and this lane's job is proving the *baked*
        # artifact is valid, not re-proving the toolchain.
        run: |
          set -o pipefail
          rm -rf "$APPLE_VALIDATION_DIR/baked"
          mkdir -p "$APPLE_VALIDATION_DIR/baked"

          python Plugin \
            --blender "$BLENDERTORCP_BLENDER" \
            --timeout 900 \
            bake-export References/Blender/RedCube.blend \
            -o "$APPLE_VALIDATION_DIR/baked/RedCube-Baked.usdz" \
            --format USDZ \
            --bake-mode LIT_IBL \
            --resolution 512 \
            --diagnostics > "$APPLE_VALIDATION_DIR/baked/bake-litibl.json"

          python Plugin \
            --blender "$BLENDERTORCP_BLENDER" \
            --timeout 900 \
            bake-export References/Blender/RedCube.blend \
            -o "$APPLE_VALIDATION_DIR/baked/RedCube-Unlit.usdc" \
            --format USDC \
            --bake-mode UNLIT_ALBEDO \
            --resolution 512 \
            --diagnostics > "$APPLE_VALIDATION_DIR/baked/bake-unlit.json"

          for asset in \
            "$APPLE_VALIDATION_DIR/baked/RedCube-Baked.usdz" \
            "$APPLE_VALIDATION_DIR/baked/RedCube-Unlit.usdc"
          do
            xcrun usdchecker --strict "$asset"
            xcrun usdchecker --arkit --strict "$asset"
          done

          for platform in xros macosx
          do
            python3 scripts/validate_exports.py \
              --input "$APPLE_VALIDATION_DIR/baked/RedCube-Unlit.usdc" \
              --platform "$platform" \
              --deployment-target 27.0 \
              --use-metal \
              --compiled-output-dir "$APPLE_VALIDATION_DIR/baked/compiled/$platform" \
              --output "$APPLE_VALIDATION_DIR/baked/validate-$platform.json"
            test -s "$APPLE_VALIDATION_DIR/baked/compiled/$platform/RedCube-Unlit-$platform-27.0.reality"
          done

          scripts/run_realitykit_runtime_smoke.sh \
            --asset "$APPLE_VALIDATION_DIR/baked/RedCube-Baked.usdz" \
              --expect-model \
              --expect-shader-graph \
            --asset "$APPLE_VALIDATION_DIR/baked/RedCube-Unlit.usdc" \
              --expect-model \
              --expect-shader-graph \
            --asset "$APPLE_VALIDATION_DIR/baked/compiled/macosx/RedCube-Unlit-macosx-27.0.reality" \
              --expect-model \
            --output "$APPLE_VALIDATION_DIR/baked/realitykit-runtime.json" \
            | tee "$APPLE_VALIDATION_DIR/baked/realitykit-runtime.log"

      - name: Validate ShaderGraph nodes with RealityKit 27
        run: |
          "$BLENDERTORCP_BLENDER" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python scripts/validate_nodes.py \
            -- \
            --output "$APPLE_VALIDATION_DIR/nodes-xros" \
            --platform xros \
            --deployment-target 27.0

          "$BLENDERTORCP_BLENDER" \
            --background \
            --factory-startup \
            --python-exit-code 1 \
            --python scripts/validate_nodes.py \
            -- \
            --output "$APPLE_VALIDATION_DIR/nodes-macosx" \
            --platform macosx \
            --deployment-target 27.0

      - name: Upload Apple 27 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-27-validation-${{ github.sha }}
          path: |
            ${{ env.APPLE_VALIDATION_DIR }}/*.json
            ${{ env.APPLE_VALIDATION_DIR }}/*.log
            ${{ env.APPLE_VALIDATION_DIR }}/*.xml
            ${{ env.APPLE_VALIDATION_DIR }}/*.usda
            ${{ env.APPLE_VALIDATION_DIR }}/compiled/**
            ${{ env.APPLE_VALIDATION_DIR }}/exports/**
            ${{ env.APPLE_VALIDATION_DIR }}/nodes-xros/node_validation.json
            ${{ env.APPLE_VALIDATION_DIR }}/nodes-macosx/node_validation.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove validation workspace from self-hosted runner
        if: always()
        run: |
          case "$APPLE_VALIDATION_DIR" in
            /tmp/blendertorcp-apple27-*) ;;
            *) echo "Refusing unsafe cleanup path: $APPLE_VALIDATION_DIR" >&2; exit 1 ;;
          esac
          case "$BLENDER_USER_RESOURCES" in
            /tmp/blendertorcp-apple-blender-user-*) ;;
            *) echo "Refusing unsafe cleanup path: $BLENDER_USER_RESOURCES" >&2; exit 1 ;;
          esac
          rm -rf -- "$APPLE_VALIDATION_DIR" "$BLENDER_USER_RESOURCES"
