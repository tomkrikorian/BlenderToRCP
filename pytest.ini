[pytest]
# scripts/tests holds the release-archive suite (unittest-style, but pytest
# collects it fine). It used to sit outside testpaths, so a bare `pytest`
# silently skipped 7 tests covering manifest validation, symlink rejection and
# legal-text completeness - they only ran because ci.yml invoked the file by
# hand as a plain script.
testpaths = tests scripts/tests
addopts = --strict-markers
markers =
    integration: requires Blender executable (skipped if unavailable)
